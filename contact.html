<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — {brand}</title>
<meta name="description" content="Contact the QA Affiliate team — partnerships, product suggestions and support.">
<link rel="icon" type="image/png" href="/assets/images/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<div data-site-header></div>
<div class="container">
  <div class="breadcrumb"><a href="/">Home</a> / Contact</div>
  <section class="section" style="padding-top:24px">
    <h1 class="section-title">Contact Us</h1>
    <p class="section-sub">Brand partnerships, product suggestions, or questions about how QA Affiliate works — we'd love to hear from you.</p>
    <div class="contact-form">
      <form id="contact-form">
        <label for="c-name">Your name</label>
        <input id="c-name" required>
        <label for="c-email">Your email</label>
        <input id="c-email" type="email" required>
        <label for="c-topic">Topic</label>
        <select id="c-topic"><option>General question</option><option>Brand partnership</option><option>Product suggestion</option><option>Affiliate program inquiry</option><option>Something else</option></select>
        <label for="c-msg">Message</label>
        <textarea id="c-msg" rows="5" required></textarea>
        <button class="btn btn-rose" type="submit" style="margin-top:18px">Send Message</button>
        <p class="form-msg" id="contact-msg"></p>
      </form>
    </div>
    <p style="margin-top:22px;color:var(--muted)">Prefer email? Reach us at <a href="mailto:hello@yourdomain.com" style="text-decoration:underline">hello@yourdomain.com</a></p>
  </section>
</div>
<div data-site-footer></div>
<script src="/assets/js/app.js"></script>
<script>
document.getElementById("contact-form").addEventListener("submit",function(e){
  e.preventDefault();
  document.getElementById("contact-msg").textContent="Thanks for reaching out! We typically reply within 2 business days.";
  e.target.reset();
});
</script>
</body>
</html>
