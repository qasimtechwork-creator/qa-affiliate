<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category — {brand}</title>
<meta name="description" content="Browse a QA Affiliate product category with search and filters.">
<link rel="icon" type="image/png" href="/assets/images/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css?v=13">
</head>
<body data-page="category">
<div data-site-header></div>
<section class="cat-banner">
  <div class="cat-banner-bg" aria-hidden="true">
    <img class="gif-anim" id="cat-banner-img" src="" alt="">
    <img class="gif-fallback" id="cat-banner-fallback" src="" alt="">
  </div>
  <div class="cat-banner-overlay"></div>
  <div class="cat-fx" aria-hidden="true">
    <span class="fx-petal d1 c-red"></span><span class="fx-petal d2 c-gold"></span>
    <span class="fx-petal d3 c-white"></span><span class="fx-petal d1 c-pink"></span>
    <span class="fx-petal d2 c-red"></span><span class="fx-petal d3 c-gold"></span>
    <span class="fx-petal d1 c-white"></span><span class="fx-petal d2 c-pink"></span>
  </div>
  <div class="container cat-banner-inner">
    <div class="breadcrumb"><a href="/">Home</a> / <a href="/products.html">Shop All</a> / <span id="crumb-cat">Category</span></div>
    <h1 class="cat-banner-title" id="cat-title">Category</h1>
    <p class="cat-banner-sub" id="cat-sub"></p>
    <p class="cat-banner-desc" id="cat-desc"></p>
  </div>
</section>
<div class="container">
  <section class="section" style="padding-top:24px">
    <div id="cat-guides"></div>
    <div class="filter-bar">
      <div class="filter-row">
        <div class="filter-group search-big"><label for="f-q">Search in this category</label><input id="f-q" type="search" placeholder="Search…"></div>
        <div class="filter-group"><label for="f-sub">Subcategory</label><select id="f-sub"><option value="">All subcategories</option></select></div>
        <div class="filter-group"><label for="f-sort">Sort</label><select id="f-sort"><option value="">Featured</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="rating">Highest rated</option><option value="discount">Biggest discount</option></select></div>
        <div class="filter-group"><label for="f-store">Store</label><select id="f-store"><option value="">All stores</option><option value="amazon">Amazon</option><option value="aliexpress">AliExpress</option><option value="temu">Temu</option></select></div>
      </div>
    </div>
    <p id="filter-count" style="color:var(--muted);margin-bottom:18px"></p>
    <div class="product-grid" id="filter-grid"></div>
    <div class="disclosure-strip">QA Affiliate is reader-supported: we may earn a commission when you buy through our links, at no extra cost to you. <a href="/legal/disclosure.html">Read our affiliate disclosure</a>.</div>
  </section>
</div>
<div data-site-footer></div>
<script src="/assets/js/app.js"></script>
</body>
</html>
